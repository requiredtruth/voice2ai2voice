plugins { id 'com.android.application' }
android {
    namespace 'com.requiredtruth.voice2ai2voice'
    compileSdk 35
    defaultConfig {
        applicationId 'com.requiredtruth.voice2ai2voice'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
