name: Build, test and release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable APK signing key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=android-signing-key&per_page=100" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/signing.zip"
            unzip -o "$RUNNER_TEMP/signing.zip" -d "$HOME/.android"
          elif gh api "repos/$GITHUB_REPOSITORY/releases" --jq 'length > 0' | grep -q true; then
            echo 'Signing key artifact expired. Restore the original debug.keystore before releasing updates.'
            exit 1
          else
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Voice2AI2Voice, O=RequiredTruth, C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Preserve development signing key for future updates
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-key
          path: ~/.android/debug.keystore
          include-hidden-files: true
          retention-days: 90
      - name: Test, lint, and build signed release
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Publish APK and source as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/voice2ai2voice.apk
          cp spec.md dist/spec.md
          git archive --format=zip HEAD -o dist/voice2ai2voice-source.zip
          (cd dist && sha256sum voice2ai2voice.apk > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Tap to speak → new OpenAI-compatible conversation → final answer spoken aloud.

          Configure your server URL, exact model ID, and optional API key in Server settings. Android speech recognition and text-to-speech services are required for voice input/output; typed input is also available.

          Reasoning fields and tagged thinking blocks are excluded from playback. Convo mode reopens the microphone after each spoken answer and sends the full conversation history. Talk to yourself uses your opening voice, then generates and speaks both sides until stopped. STOP cancels all active work; tapping an active mode again also ends it. The normal voice/text buttons always start fresh.

          Leaving the app or a speech/server error stops automatic modes. Self-talk makes repeated server requests until stopped.

          Native Android 8.0+ APK, signed for sideload installation. Tests and Android release lint must pass before publication. Physical-device microphone and speaker testing remains to be done.
          NOTES
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Voice → AI → Voice $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release*
